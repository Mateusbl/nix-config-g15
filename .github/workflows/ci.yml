# Checks every push to main and every pull request. Nothing is deployed from here.
#
# The system is evaluated, not built: a full build would download and compile several GB
# (kernel modules, NVIDIA driver, bootvine) on every run. Evaluation already catches wrong
# option names, type errors, missing packages and broken imports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Plain git instead of actions/checkout: this workflow uses no actions at all, so it
      # runs whatever the repository's "allowed actions" setting is.
      - name: Check out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      # The official installer script, so the workflow needs no third-party action.
      # The only substituter is cache.nixos.org.
      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Formatting (nixfmt)
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Evaluate the flake and the whole system
        run: nix flake check --no-build

      - name: Evaluate a fresh install (without existing-install.nix)
        run: |
          # The install guide (README, path B) removes this import; make sure that still evaluates.
          sed -i '/existing-install.nix/d' hosts/g15/default.nix
          nix eval --raw .#nixosConfigurations.g15.config.system.build.toplevel.drvPath
