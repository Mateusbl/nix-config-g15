# The test suite: runs on every pull request and every push to main. Nothing is deployed.
#
#   1. formatting (nixfmt)
#   2. `nix flake check`: evaluates the whole NixOS + home-manager configuration
#   3. Hyprland's own config check of the generated hyprland.lua
#   4. the login screen (ctOS greeter) starts headless and draws its screen
#   5. the full system build, the same `nix build` the laptop runs
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        # Explicit bash runs with `-eo pipefail`: a failure anywhere in a pipeline fails the step.
        shell: bash
    steps:
      # The system closure is ~12 GB; the runner image ships toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Actions are pinned to a commit (the tag is in the comment): a tag can be moved to other
      # code later, a commit cannot. v5 runs on Node.js 24 (v4's Node.js 20 is deprecated).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing here pushes, so don't leave a token in .git

      # Installs plain upstream Nix. Despite the action's name, no Cachix cache is used:
      # the only substituter is cache.nixos.org.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Formatting (nixfmt)
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Evaluate the flake and the whole system
        run: nix flake check --no-build

      - name: Hyprland config check
        run: |
          hm='.#nixosConfigurations.g15.config.home-manager.users.mateus'
          lua=$(nix build --no-link --print-out-paths "$hm.xdg.configFile.\"hypr/hyprland.lua\".source")
          hyprland=$(nix build --no-link --print-out-paths '.#nixosConfigurations.g15.pkgs.hyprland^out')
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          out=$(mktemp)
          "$hyprland/bin/Hyprland" --verify-config -c "$lua" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$out"
          grep -q "config ok" "$out" || { echo "::error::Hyprland rejected the config"; exit 1; }

      # Starts the login screen (ctOS, modules/nixos/ctos-greeter.nix) the way greetd does, kiosk
      # mode inside cage, on a headless screen with software rendering. It must still be running
      # after a few seconds (ctOS quits on errors in its config) and must have drawn a real screen.
      - name: Login screen starts (ctOS greeter, headless)
        run: |
          sys='.#nixosConfigurations.g15'
          build() { nix build --no-link --print-out-paths "$1"; }
          ctos=$(build "$sys.config.system.build.ctosGreeter")
          fonts=$(build "$sys.config.system.build.ctosGreeter.fontsConf")
          conf=$(build "$sys.config.environment.etc.\"ctos/greeter.config.json\".source")
          qs=$(build "$sys.pkgs.quickshell")
          cage=$(build "$sys.pkgs.cage")
          grim=$(build "$sys.pkgs.grim")
          magick=$(build "$sys.pkgs.imagemagick")

          # What the NixOS module and its tmpfiles rules create on the laptop.
          sudo install -Dm644 "$conf" /etc/ctos/greeter.config.json
          sudo install -d -m 777 /var/lib/ctos
          echo '{}' > /var/lib/ctos/greeter.state.json

          XDG_RUNTIME_DIR=$(mktemp -d)
          HOME=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR HOME WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            LIBSEAT_BACKEND=noop QT_QUICK_BACKEND=software FONTCONFIG_FILE="$fonts" \
            CTOS_MODE=kiosk
          work=$(mktemp -d)
          "$cage/bin/cage" -d -- "$qs/bin/quickshell" --path "$ctos/share/ctos/greeter.qml" > "$work/log" 2>&1 &
          cage_pid=$!
          sleep 12

          fail() { echo "::error::$1"; sed 's/\x1b\[[0-9;]*m//g' "$work/log"; exit 1; }
          kill -0 "$cage_pid" 2>/dev/null || fail "the greeter exited"
          ! grep -q CRITICAL "$work/log" || fail "the greeter reported a critical error"
          display=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -1)
          WAYLAND_DISPLAY=$display "$grim/bin/grim" "$work/screen.png"
          colours=$("$magick/bin/magick" "$work/screen.png" -format %k info:)
          echo "colours on screen: $colours"
          [ "$colours" -gt 16 ] || fail "the screen is (nearly) blank"
          kill "$cage_pid"

      - name: Build the system
        run: nix build --no-link .#nixosConfigurations.g15.config.system.build.toplevel
