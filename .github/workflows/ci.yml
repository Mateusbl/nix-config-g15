# Checks every push to main and every pull request. Nothing is deployed from here.
#
# The system is evaluated, not built: a full build would download and compile several GB
# (kernel modules, NVIDIA driver, bootvine) on every run. Evaluation already catches wrong
# option names, type errors, missing packages and broken imports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs plain upstream Nix. Despite the action's name, no Cachix cache is used:
      # the only substituter is cache.nixos.org.
      - uses: cachix/install-nix-action@v31

      - name: Formatting (nixfmt)
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Evaluate the flake and the whole system
        run: nix flake check --no-build
