# The test suite: runs on every pull request and every push to main. Nothing is deployed.
#
#   1. formatting (nixfmt)
#   2. `nix flake check`: evaluates the whole NixOS + home-manager configuration
#   3. Hyprland's own config check, once per monitor profile (home/monitors.nix): each profile
#      template is filled in with example connector names and loaded through hyprland.lua
#   4. hyprdynamicmonitors' own config check
#   5. the full system build, the same `nix build` the laptop runs
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        # Explicit bash runs with `-eo pipefail`: a failure anywhere in a pipeline fails the step.
        shell: bash
    steps:
      # The system closure is ~12 GB; the runner image ships toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      # Installs plain upstream Nix. Despite the action's name, no Cachix cache is used:
      # the only substituter is cache.nixos.org.
      - uses: cachix/install-nix-action@v31

      - name: Formatting (nixfmt)
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Evaluate the flake and the whole system
        run: nix flake check --no-build

      - name: Hyprland config check (every monitor profile)
        run: |
          hm='.#nixosConfigurations.g15.config.home-manager.users.mateus'
          lua=$(nix build --no-link --print-out-paths "$hm.xdg.configFile.\"hypr/hyprland.lua\".source")
          toml=$(nix build --no-link --print-out-paths "$hm.xdg.configFile.\"hyprdynamicmonitors/config.toml\".source")
          hyprland=$(nix build --no-link --print-out-paths '.#nixosConfigurations.g15.pkgs.hyprland^out')
          dest=$(grep -o '^destination = "[^"]*"' "$toml" | cut -d'"' -f2)
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          work=$(mktemp -d)

          check() { # check <name> <hyprland.lua>
            "$hyprland/bin/Hyprland" --verify-config -c "$2" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$work/out"
            grep -q "config ok" "$work/out" || { echo "::error::Hyprland rejected the config ($1)"; exit 1; }
          }

          check "no monitors.lua yet" "$lua"
          grep -o '/nix/store/[^"]*\.lua\.tmpl' "$toml" | while read -r tmpl; do
            # shellcheck disable=SC2016 # the $ is a literal part of the template fields
            sed -e '/^{{-/d' -e 's/{{ \$laptop\.Name }}/eDP-1/g' -e 's/{{ \$external\.Name }}/HDMI-A-1/g' \
              "$tmpl" > "$work/monitors.lua"
            if grep -q '{{' "$work/monitors.lua"; then echo "::error::unfilled template field in $tmpl"; exit 1; fi
            sed "s#$dest#$work/monitors.lua#" "$lua" > "$work/hyprland.lua"
            echo "== $tmpl"; cat "$work/monitors.lua"
            check "$tmpl" "$work/hyprland.lua"
          done

      - name: hyprdynamicmonitors config check
        run: |
          hm='.#nixosConfigurations.g15.config.home-manager.users.mateus'
          toml=$(nix build --no-link --print-out-paths "$hm.xdg.configFile.\"hyprdynamicmonitors/config.toml\".source")
          hdm=$(nix build --no-link --print-out-paths .#nixosConfigurations.g15.pkgs.hyprdynamicmonitors)
          cat "$toml"
          "$hdm/bin/hyprdynamicmonitors" validate --config "$toml"

      - name: Build the system
        run: nix build --no-link .#nixosConfigurations.g15.config.system.build.toplevel
